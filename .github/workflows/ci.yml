name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, types & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint -- --error-on-warnings

      - name: TypeScript type check
        run: npx tsc -p tsconfig.types.json --noEmit

      - name: Tests
        run: npm test
