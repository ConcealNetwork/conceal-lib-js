name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Lint, types & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint -- --error-on-warnings

      - name: TypeScript type check
        run: npx tsc -p tsconfig.types.json --noEmit

      - name: Tests
        run: npm test
